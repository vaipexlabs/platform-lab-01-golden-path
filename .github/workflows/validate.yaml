name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Go quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum

      - name: Validate source
        run: ./scripts/validate.sh

  container:
    name: Container build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build production image
        run: docker build --tag golden-path-service:ci .

  platform:
    name: Platform configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.2

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize deploy/kubernetes/overlays/local \
            > "$RUNNER_TEMP/golden-path.yaml"
          test -s "$RUNNER_TEMP/golden-path.yaml"

      - name: Validate Prometheus rules
        run: |
          sed -n '/^spec:/,$p' deploy/monitoring/prometheus-rules.yaml \
            | sed '1d;s/^  //' \
            | docker run --rm --interactive \
                --entrypoint=/bin/promtool \
                prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 \
                check rules

      - name: Validate monitoring configuration
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm pull prometheus-community/kube-prometheus-stack \
            --version 88.1.5 \
            --untar \
            --untardir "$RUNNER_TEMP"
          helm lint "$RUNNER_TEMP/kube-prometheus-stack" \
            --values deploy/monitoring/kube-prometheus-stack-values.yaml
          helm template monitoring "$RUNNER_TEMP/kube-prometheus-stack" \
            --namespace monitoring \
            --values deploy/monitoring/kube-prometheus-stack-values.yaml \
            > "$RUNNER_TEMP/monitoring.yaml"
          test -s "$RUNNER_TEMP/monitoring.yaml"
